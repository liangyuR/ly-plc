[package]
name = "ly-plc"
version = "0.3.1"
edition = "2021"
description = "通用 PLC 通讯库：Modbus TCP / Siemens S7 / Mitsubishi MC，含轮询引擎与 SQLite 日志"
license = "MIT"

[dependencies]
async-trait = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
